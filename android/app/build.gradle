plugins { id 'com.android.application' }

android {
    namespace 'io.voteatlas.collector'
    compileSdk 35

    defaultConfig {
        applicationId 'io.voteatlas.collector'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
