name: Collect Android apps in isolated cloud emulators
on:
  push:
    branches: [feat/android-cloud-collection-20261104]
    paths: ['scripts/cloud_android.py', '.github/workflows/cloud-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        app: [my1pick, mubeat, coogoong]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare OCR and verify Python syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr-kor tesseract-ocr-eng
          python3 -m py_compile scripts/cloud_android.py
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim'
          script: python3 scripts/cloud_android.py --app ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.app }}-evidence
          path: verification/cloud-android/
          retention-days: 7
          if-no-files-found: warn
