name: Test Vote Atlas dashboard
on:
  pull_request:
    paths:
      - 'dist/*.js'
      - 'dist/*.html'
      - 'dist/*.css'
      - 'tests/test_rankings.cjs'
      - 'tests/test_calendar.cjs'
      - 'tests/test_reward_groups.cjs'
      - 'dist/reward-groups.js'
      - 'tests/test_awards.py'
      - 'scripts/discover_awards.py'
      - '.github/workflows/check-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/overview.js
          node --check dist/rankings.js
          node --check dist/calendar-utils.js
          node --check dist/rewards.js
          node --check dist/reward-groups.js
          node --check dist/awards.js
          python3 -m unittest discover -s tests -p 'test_awards.py' -v
      - name: Test artist ranking logic
        run: node --test tests/test_rankings.cjs tests/test_calendar.cjs tests/test_rewards_ui.cjs tests/test_reward_groups.cjs
