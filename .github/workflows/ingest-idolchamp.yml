name: Ingest IdolChamp device observations
on:
  push:
    branches: [main]
    paths:
      - 'incoming/idolchamp/**'
      - 'scripts/ingest_idolchamp.py'
      - '.github/workflows/ingest-idolchamp.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-vote-collection
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and merge phone observations
        run: python3 scripts/ingest_idolchamp.py
      - name: Commit verified observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data/events.json dist/data/vote_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Merge IdolChamp Android observations'
            git pull --rebase origin main
            git push
          fi
