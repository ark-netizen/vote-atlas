name: Collect official voting data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/web_collect.py'
      - 'scripts/vote_cost.py'
      - 'scripts/vote_cost_rules.py'
      - 'tests/test_vote_cost.py'
      - 'scripts/merge_collected_data.py'
      - 'tests/test_merge_collected_data.py'
      - 'scripts/vote_history.py'
      - 'tests/test_vote_history.py'
      - 'scripts/official_web_rules.py'
      - 'scripts/reward_parse.py'
      - 'scripts/official_sns_collect.py'
      - 'config/apps.json'
      - 'tests/test_reward_rules.py'
      - 'tests/test_web_collect.py'
      - 'tests/test_rewards.py'
      - 'requirements.txt'
      - '.github/workflows/collect-public.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 0,12 * * *'
permissions:
  contents: write
concurrency:
  group: public-vote-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/web_collect.py
      - name: Preserve daily vote history from verified observations
        run: python scripts/vote_history.py --backfill-git
      - name: Merge and save collection without overwriting concurrent updates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp dist/data/events.json "$RUNNER_TEMP/collected_events.json"
          cp dist/data/vote_history.json "$RUNNER_TEMP/collected_history.json"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_collected_data.py "$RUNNER_TEMP/collected_events.json" "$RUNNER_TEMP/collected_history.json"
            git add dist/data/events.json dist/data/vote_history.json
            if git diff --cached --quiet; then
              echo 'No new verified data to publish'
              exit 0
            fi
            git commit -m 'Update official voting data'
            if git push origin HEAD:main; then
              echo 'Data saved safely'
              exit 0
            fi
            echo "Main changed during push; merging again (attempt $attempt)"
          done
          echo 'Failed to publish after four conflict-safe merge attempts'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collected-voting-data
          path: |
            dist/data/events.json
            dist/data/vote_history.json
          retention-days: 7
