name: Publish Vote Atlas dashboard
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows: ['Collect official voting data']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: vote-atlas-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check dashboard JavaScript
        run: node --check dist/overview.js && node --check dist/app.js && node --check dist/rankings.js && node --check dist/calendar-utils.js && node --check dist/rewards.js && node --check dist/reward-groups.js && node --check dist/reward-series.js && node --check dist/vote-trends.js && node --check dist/trend-dashboard.js && node --check dist/workspace-nav.js && node --check dist/app.js && node --check dist/awards.js && node --check dist/awards-calendar.js && node --test tests/test_awards_calendar.cjs && python3 -m unittest discover -s tests -p 'test_awards.py' -v && node --test tests/test_rankings.cjs tests/test_calendar.cjs tests/test_rewards_ui.cjs tests/test_reward_groups.cjs tests/test_reward_series.cjs tests/test_vote_trends.cjs tests/test_workspace_nav.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
