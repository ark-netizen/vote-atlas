name: Validate Android voting apps (APK required)
on:
  push:
    branches: [feat/rewards-tab-android-validation-20261103]
    paths:
      - 'scripts/validate_android_apps.py'
      - '.github/workflows/validate-android-apps.yml'
  workflow_dispatch:
    inputs:
      app:
        description: '확인할 앱 (직접 APK 입력 시 1개 선택)'
        required: true
        default: all
        type: choice
        options: [all, my1pick, idolchamp, mubeat, coogoong]
      apk_url:
        description: '검증된 공식 HTTPS 직접 APK 다운로드 URL (없으면 상태만 점검)'
        required: false
        type: string
      apk_sha256:
        description: '위 APK 파일의 64자리 SHA-256 (URL 입력 시 필수)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and inspect APK/app availability
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_URL: ${{ inputs.apk_url || '' }}
          APK_SHA256: ${{ inputs.apk_sha256 || '' }}
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr-kor tesseract-ocr-eng
            python3 scripts/validate_android_apps.py --app "${{ inputs.app || 'all' }}"
      - name: Publish non-sensitive verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-app-validation
          path: verification/android-apps/
          if-no-files-found: warn
          retention-days: 7
