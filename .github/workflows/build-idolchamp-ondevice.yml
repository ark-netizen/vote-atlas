name: Build IdolChamp physical-device capture APK
on:
  push:
    branches: [feat/idolchamp-ondevice-collector-20261104]
    paths: ['android/idolchamp-capture/**', '.github/workflows/build-idolchamp-ondevice.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: android/idolchamp-capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using hosted runner tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK on GitHub; no local PowerShell or USB required
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate package, service, and no network permission
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep "package: name='com.voteatlas.idolcapture'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep 'IdolCaptureService'
          if "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo 'Unexpected network permission' >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: idolchamp-ondevice-collector-apk
          path: android/idolchamp-capture/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
