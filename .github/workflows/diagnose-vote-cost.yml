name: Diagnose public vote cost source (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-vote-cost.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public website and API schema
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request, html
          from html.parser import HTMLParser
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"VoteAtlas/1.0 (public voting calendar; read-only)","Accept-Language":"ko"})
              with urllib.request.urlopen(req,timeout=25) as f:
                  return f.read().decode("utf-8")
          url="https://www.muniverse.io/votes"
          try:
              raw=get(url)
              visible=re.sub(r"<[^>]*>"," ",re.sub(r"<script.*?</script>|<style.*?</style>"," ",raw,flags=re.I|re.S))
              visible=re.sub(r"\s+"," ",html.unescape(visible))
              print("LIST: HTML chars",len(raw),"visible chars",len(visible),"title",visible.find("WEEKLY M PICK"),"cost",visible.find("표 당"))
              for query in ("WEEKLY M PICK","표 당","표당","voteCost","votePrice","votePoint","NEXT_DATA"):
                  i=raw.lower().find(query.lower());print("LIST MARKER",query,"index",i,"snippet",raw[max(0,i-100):i+220].replace("\n"," ") if i>=0 else "")
          except Exception as e:
              print("LIST FAIL",type(e).__name__,str(e)[:200])
          try:
              j=json.loads(get("https://api.muniverse.io/api/v2/votes?status=all&page=1&pageSize=10"))
              print("API list top keys",list(j.keys()),"first item keys",list(j.get("data",[])[0].keys()) if j.get("data") else [])
              if j.get("data"):
                  one=j["data"][0];code=one["voteCode"]
                  for k,v in one.items():
                      if re.search("price|fee|cost|point|currency|lumi|lumi|vote.*count|gold|free|ad",k,re.I):
                          print("API list candidate",k,str(v)[:250])
                  detail=json.loads(get("https://api.muniverse.io/api/v2/votes/"+code))
                  print("API detail keys",list(detail.keys()))
                  for k,v in detail.items():
                      if re.search("price|fee|cost|point|currency|lumi|gold|free|ad|ticket|vote.*(amount|use|rate)",k,re.I):
                          print("API detail candidate",k,str(v)[:800])
          except Exception as e:
              print("API FAIL",type(e).__name__,str(e)[:250])
          PY
