name: Test IdolChamp on alternative Android emulator profiles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/idolchamp-emulator-lab.yml
      - scripts/emulator_lab_idolchamp.sh
permissions:
  contents: read
jobs:
  run-emulator-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            profile: pixel_5
          - api: 34
            profile: pixel_7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download publicly distributed IdolChamp test package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/idolchamp-splits"
          curl -fLSs --retry 2 --connect-timeout 15 --max-time 240 -A 'Mozilla/5.0' 'https://d.apkpure.net/b/XAPK/com.nwz.ichampclient?version=latest' -o "$RUNNER_TEMP/idolchamp.xapk"
          test "$(stat -c %s "$RUNNER_TEMP/idolchamp.xapk")" -gt 10000000
          file "$RUNNER_TEMP/idolchamp.xapk"
          unzip -t "$RUNNER_TEMP/idolchamp.xapk" | tail -n 2
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import os
          home=Path(os.environ['RUNNER_TEMP'])
          target=home/'idolchamp-splits'
          with ZipFile(home/'idolchamp.xapk') as z:
              for entry in z.infolist():
                  name=Path(entry.filename).name
                  if not name.lower().endswith('.apk'):
                      continue
                  destination=target/name
                  destination.write_bytes(z.read(entry))
                  print(name,destination.stat().st_size,hashlib.sha256(destination.read_bytes()).hexdigest(),flush=True)
          if not list(target.glob('*.apk')):
              raise RuntimeError('No APK splits inside archive')
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and attempt install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/emulator_lab_idolchamp.sh
      - name: Retain diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-lab-api${{ matrix.api }}
          path: |
            ${{ runner.temp }}/idolchamp-lab/result.txt
            ${{ runner.temp }}/idolchamp-lab/install.log
            ${{ runner.temp }}/idolchamp-lab/emulator-screen.png
            ${{ runner.temp }}/idolchamp-lab/emulator-logcat.txt
            ${{ runner.temp }}/idolchamp-lab/window.xml
          if-no-files-found: ignore
          retention-days: 3
